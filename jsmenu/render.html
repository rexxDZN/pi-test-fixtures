<!doctype html><html><head><title>JS menu render</title></head><body><h1>JS menu render</h1><ul id="nav"></ul><script>function fill(){var n=document.getElementById('nav');if(n.children.length)return;[1,2,3,4].forEach(function(i){var li=document.createElement('li');li.innerHTML='<a href="m'+i+'.html">Menu page '+i+'</a>';n.appendChild(li)})} fill();</script></body></html>
